services:
  postgres:
    image: postgres:17-alpine
    container_name: restaurant-manager-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U restaurant-manager -d restaurant-manager" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-manager-network

  restaurant-manager-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-manager
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurant-manager-network

volumes:
  postgres_data:
    driver: local

networks:
  restaurant-manager-network:
    driver: bridge
